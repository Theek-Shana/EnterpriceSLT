<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HNB Internal System – Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1b33;--mu:#6b7791;--bd:#e3e8f1;--gold:#f5b800;--gold2:#ffd54a;--rd:#d93f3f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Plus Jakarta Sans',system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);display:grid;grid-template-columns:1.05fr 1fr;background:#fff}
.side{background:radial-gradient(700px 400px at 100% 0,rgba(245,184,0,.25),transparent 60%),linear-gradient(160deg,#0f1b33,#16264a);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-weight:800;font-size:22px}.logo b{background:var(--gold);color:#201800;padding:2px 9px;border-radius:7px;margin-right:8px}
.side h1{font-size:38px;line-height:1.15;margin:0 0 14px;letter-spacing:-.5px}.side h1 span{color:var(--gold)}
.side p{color:#a9b6d3;max-width:420px;line-height:1.6;margin:0}
.side small{color:#7f8db0}
.main{display:grid;place-items:center;padding:28px}
.box{width:100%;max-width:380px}
.box h2{font-size:24px;margin:0 0 6px}.sub{color:var(--mu);font-size:14px;margin:0 0 26px}
.f{margin-bottom:16px}.f label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:6px}
.in{position:relative}
.in input{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;font:inherit;font-size:14px;color:var(--ink);outline:none;background:#f8fafd}
.in input:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(245,184,0,.2)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);font-size:12px;padding:6px;cursor:pointer}
.err{color:var(--rd);font-size:13px;min-height:18px;margin:0 0 10px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#201800;transition:.15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:wait}
.note{margin-top:18px;font-size:12px;color:var(--mu);text-align:center}
@media(max-width:820px){body{grid-template-columns:1fr}.side{display:none}}
</style></head>
<body>
<section class="side">
  <div class="logo"><b>HNB</b>Internal Portal</div>
  <div><h1>One workspace for <span>every team.</span></h1><p>Secure access for Hatton National Bank staff. Sign in with your HNB work email.</p></div>
  <small>For authorised HNB employees only. Activity may be monitored.</small>
</section>
<section class="main">
  <div class="box">
    <h2>Staff sign in</h2><p class="sub">Use your HNB work email to continue</p>
    <div class="f"><label for="em">Work email</label><div class="in"><input id="em" type="email" autocomplete="username" placeholder="name@hnb.lk"></div></div>
    <div class="f"><label for="pw">Password</label><div class="in"><input id="pw" type="password" autocomplete="current-password" placeholder="Enter password"><button class="eye" id="eye" type="button">Show</button></div></div>
    <div class="err" id="err"></div>
    <button class="btn" id="go">Sign in</button>
    <p class="note">Demo: any <b>@hnb.lk</b> email with any password</p>
  </div>
</section>
<script>
  const $ = id => document.getElementById(id);
  if (sessionStorage.getItem('hnbStaff')) location.replace('dashboard.html');

  $('eye').onclick = () => { const h = $('pw').type === 'password'; $('pw').type = h ? 'text' : 'password'; $('eye').textContent = h ? 'Hide' : 'Show'; };

  function login() {
    const email = $('em').value.trim().toLowerCase(), pw = $('pw').value;
    $('err').textContent = '';
    if (!/^[^\s@]+@hnb\.(lk|net)$/.test(email)) { $('err').textContent = 'Enter your HNB work email (e.g. name@hnb.lk).'; return; }
    if (!pw) { $('err').textContent = 'Enter your password.'; return; }   // demo: any password is accepted
    $('go').disabled = true; $('go').textContent = 'Signing in…';
    const name = email.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    sessionStorage.setItem('hnbStaff', JSON.stringify({ email, name }));
    setTimeout(() => location.replace('dashboard.html'), 400);
  }
  $('go').onclick = login;
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body></html>
